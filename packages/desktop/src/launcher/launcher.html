<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:" />
    <title>ScribUI</title>
    <style>
      :root {
        --bg: #ededed;
        --surface: #ffffff;
        --surface-2: #f6f6f6;
        --line: #e7e7e7;
        --fg: #262626;
        --fg-dim: #5e5e5e;
        --fg-faint: #9a9a9a;
        --accent: #fc9803;
        --accent-soft: rgba(252, 152, 3, 0.14);
        --green: #3e7a1e;
        --red: #c02648;
        --yellow: #9a6a00;
        --logo-back: #d9d9d9;
        --shadow: 3px 4px 19px 5px rgba(0, 0, 0, 0.1);
        --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        --sans: "Inter", -apple-system, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif;
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #111113;
          --surface: #232327;
          --surface-2: #2a2a2f;
          --line: #34343a;
          --fg: #f3f3f3;
          --fg-dim: #a6a6ae;
          --fg-faint: #6d6d76;
          --accent-soft: rgba(252, 152, 3, 0.18);
          --green: #8fd16a;
          --red: #ff7a93;
          --yellow: #f2c14e;
          --logo-back: #5a5a62;
          --shadow: 3px 4px 19px 5px rgba(0, 0, 0, 0.4);
          color-scheme: dark;
        }
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; }
      body { background: var(--bg); color: var(--fg); font: 13px/1.45 var(--sans); -webkit-font-smoothing: antialiased; user-select: none; }
      main { max-width: 760px; margin: 0 auto; padding: 28px 24px 24px; display: flex; flex-direction: column; gap: 22px; }
      .logo { position: relative; height: 22px; width: 110px; }
      .logo-back { position: absolute; left: 15px; top: 14px; width: 11px; height: 11px; background: var(--logo-back); }
      .logo-front { position: absolute; left: 0; top: 0; width: 21px; height: 20px; background: var(--accent); }
      .logo-name { position: absolute; left: 35px; top: 0; font: 300 17px/20px var(--sans); }
      section { background: var(--surface); box-shadow: var(--shadow); border: 1px solid var(--line); }
      .head { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
      .head h2 { margin: 0; font-size: 13px; font-weight: 600; flex: 1; }
      .head .sub { color: var(--fg-faint); font-weight: 400; margin-left: 6px; }
      button { font: inherit; color: inherit; cursor: pointer; }
      .btn { border: 1px solid var(--line); background: var(--surface-2); padding: 6px 12px; }
      .btn:hover { border-color: var(--fg-faint); }
      .btn.primary { background: var(--accent); border-color: var(--accent); color: #262626; font-weight: 600; }
      .btn.primary:hover { filter: brightness(1.05); }
      .btn:disabled { opacity: 0.5; cursor: default; }
      ul { list-style: none; margin: 0; padding: 0; }
      .project { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; align-items: center; gap: 4px 14px; padding: 10px 14px; border-bottom: 1px solid var(--line); cursor: pointer; }
      .project:last-child { border-bottom: 0; }
      .project:hover, .project:focus-visible { background: var(--accent-soft); outline: none; }
      .project.missing { cursor: default; }
      .project.missing:hover { background: none; }
      .project .name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .project .path { grid-column: 1; color: var(--fg-faint); font: 11px/1.3 var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: rtl; text-align: left; }
      .project .meta { grid-row: 1 / span 2; grid-column: 2; color: var(--fg-dim); font-size: 11.5px; text-align: right; white-space: nowrap; }
      .tag { display: inline-block; font: 10.5px/1 var(--mono); padding: 3px 5px; border: 1px solid var(--line); color: var(--fg-dim); margin-right: 8px; text-transform: lowercase; }
      .tag.open { border-color: var(--green); color: var(--green); }
      .tag.missing { border-color: var(--red); color: var(--red); }
      .remove { grid-row: 1 / span 2; grid-column: 3; border: 0; background: none; color: var(--fg-faint); font-size: 16px; line-height: 1; padding: 4px 6px; visibility: hidden; }
      .project:hover .remove, .project.missing .remove, .remove:focus-visible { visibility: visible; }
      .remove:hover { color: var(--red); }
      .project .error { grid-column: 1 / -1; color: var(--red); font-size: 12px; user-select: text; }
      .project .error code { color: var(--fg); }
      .empty { padding: 26px 14px; color: var(--fg-dim); text-align: center; }
      .empty code, .hint code { font: 11.5px var(--mono); background: var(--surface-2); padding: 1px 5px; }
      .tool { display: grid; grid-template-columns: 14px 150px minmax(0, 1fr); gap: 2px 10px; padding: 9px 14px; border-bottom: 1px solid var(--line); align-items: baseline; }
      .tool:last-child { border-bottom: 0; }
      .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); align-self: center; }
      .tool.missing .dot { background: transparent; border: 1.5px solid var(--fg-faint); }
      .tool.missing.required .dot { border-color: var(--red); }
      .tool .tname { font-weight: 600; }
      .tool .tname small { display: block; font-weight: 400; color: var(--fg-faint); font-size: 11px; }
      .tool .detail { color: var(--fg-dim); font-size: 12px; overflow: hidden; text-overflow: ellipsis; user-select: text; }
      .tool .detail .path { font: 11px var(--mono); color: var(--fg-faint); }
      .install { display: flex; gap: 6px; margin-top: 6px; align-items: stretch; }
      .install code { flex: 1; min-width: 0; font: 11.5px/1.4 var(--mono); background: var(--surface-2); border: 1px solid var(--line); padding: 5px 8px; overflow-x: auto; white-space: nowrap; user-select: text; }
      .install .btn { padding: 4px 10px; font-size: 12px; }
      .install a { align-self: center; color: var(--fg-dim); font-size: 12px; }
      .checking { padding: 14px; color: var(--fg-faint); }
      footer { color: var(--fg-faint); font-size: 11px; text-align: center; }
    </style>
    <script src="./launcher.js" defer></script>
  </head>
  <body>
    <main>
      <div class="logo" aria-label="ScribUI"><span class="logo-back"></span><span class="logo-front"></span><span class="logo-name">ScribUI</span></div>
      <section aria-labelledby="projects-title">
        <div class="head">
          <h2 id="projects-title">Projects</h2>
          <button class="btn primary" id="open">Open folder…</button>
        </div>
        <ul id="projects"></ul>
      </section>
      <section aria-labelledby="tools-title">
        <div class="head">
          <h2 id="tools-title">Device tools<span class="sub">for Android and iOS projects; web projects need none</span></h2>
          <button class="btn" id="recheck">Check again</button>
        </div>
        <div id="tools"><div class="checking">Checking…</div></div>
      </section>
      <footer id="version"></footer>
    </main>
  </body>
</html>
