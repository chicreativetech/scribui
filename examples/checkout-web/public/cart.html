<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Cart</title><link rel="stylesheet" href="/style.css"></head>
<body>
<header><a href="/" aria-label="Back" data-testid="backButton">‹</a><h1>Cart</h1><span></span></header>
<main>
  <div class="banner" data-testid="promoBanner"><span>Apply promo code</span><span>›</span></div>
  <div class="card row" data-testid="cartItem-monstera"><div class="thumb"></div><div><div>Monstera Deliciosa</div><div class="muted">Qty 1</div></div><div class="price">€49</div></div>
  <div class="card row" data-testid="cartItem-fern"><div class="thumb"></div><div><div>Boston Fern</div><div class="muted">Qty 2</div></div><div class="price">€38</div></div>
  <div class="card" data-testid="orderSummary"><div class="row"><span class="muted">Subtotal</span><span class="price">€87</span></div><div class="row"><span class="muted">Delivery</span><span class="price">Free</span></div><div class="total" style="margin-top:8px"><span>Total</span><span>€87</span></div></div>
  <button data-testid="checkoutButton">Go to checkout</button>
</main>
</body></html>
